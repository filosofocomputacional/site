<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapeamento de Sala</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8fafc; min-height: 100vh; }
    header { background: #0f172a; color: white; padding: 1rem 1.5rem; position: sticky; top: 0; z-index: 50; }
    .header-inner { max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; }
    .header-left h1 { font-size: 1.1rem; font-weight: 700; }
    .header-left p { font-size: 0.75rem; color: #94a3b8; margin-top: 0.25rem; }
    .header-right { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .btn { padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 0.375rem; cursor: pointer; border: none; font-size: 0.9rem; }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-secondary { background: #e2e8f0; color: #1e293b; }
    .btn-secondary:hover { background: #cbd5e1; }
    .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
    .hidden { display: none !important; }
    select { padding: 0.625rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; font-size: 1rem; width: 100%; max-width: 300px; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.375rem; font-weight: 500; color: #334155; }
    .tela { padding: 1rem 0; }
    .grade-assentos { display: grid; gap: 0.5rem; margin-top: 1.5rem; }
    .fila { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }
    .assento { width: 80px; height: 80px; border-radius: 0.5rem; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid #cbd5e1; background: white; cursor: pointer; transition: all 0.2s; text-align: center; padding: 0.25rem; }
    .assento:hover { border-color: #3b82f6; background: #eff6ff; }
    .assento.ocupado { border-color: #ef4444; background: #fef2f2; }
    .assento.livre { border-color: #22c55e; background: #f0fdf4; }
    .nome-aluno { font-size: 0.65rem; word-break: break-all; max-width: 100%; line-height: 1; margin-top: 0.25rem; }
    .numero-assento { font-weight: 700; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="header-left">
        <h1 id="titulo-turma">Mapeamento de Sala</h1>
        <p>Organização dos assentos</p>
      </div>
      <div class="header-right">
        <a id="btn-carometro" href="index.html" class="btn btn-secondary">
          <i class="fas fa-users"></i> Carômetro
        </a>
        <a id="btn-diario-bordo" href="diariodebordo.html" class="btn btn-secondary">
          <i class="fas fa-book"></i> Diário de Bordo
        </a>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Tela de Seleção — NÃO APARECE quando vier pela URL -->
    <div id="tela-selecao" class="tela">
      <h2 class="text-xl font-bold mb-4">Escolha a Turma</h2>
      <div class="form-group">
        <label for="select-etapa">Etapa</label>
        <select id="select-etapa" onchange="filtrarTurmasPorEtapa()">
          <option value="">-- Selecione --</option>
          <option value="1 REG">1ª Etapa - REG</option>
          <option value="1 ADM">1ª Etapa - ADM</option>
          <option value="2 REG">2ª Etapa - REG</option>
          <option value="3 REG">3ª Etapa - REG</option>
        </select>
      </div>
      <div class="form-group">
        <label for="select-turmas">Turma</label>
        <select id="select-turmas" disabled onchange="selecionarTurmaManual(this.value)">
          <option value="">-- Escolha uma Turma --</option>
        </select>
      </div>
    </div>

    <!-- Tela do Mapeamento -->
    <div id="tela-mapeamento" class="tela hidden">
      <h2 class="text-xl font-bold mb-4" id="nome-turma-titulo"></h2>
      
      <div class="grade-assentos" id="grade-assentos">
        <!-- Assentos gerados via JS -->
      </div>

      <div class="mt-6 flex gap-3">
        <button class="btn btn-secondary" onclick="voltarParaSelecao()">
          <i class="fas fa-arrow-left"></i> Trocar Turma
        </button>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://vydnefdeqljazqaisslq.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ5ZG5lZmRlcWxqYXpxYWlzc2xxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4MTkwNDEsImV4cCI6MjA5ODM5NTA0MX0.tnt7XMk3lpHU00lWQH-0wg-9fCjKEc4MiMVgZZWlY2U";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let todasAsTurmas = [];
    let turmaAtualSelecionada = "";
    const CHAVE_EXPIRACAO = "carometro_sessao_expiracao";

    document.addEventListener("DOMContentLoaded", async () => {
      const params = new URLSearchParams(window.location.search);
      const turmaVinda = params.get('turma');

      if (!verificarSessao()) return;

      if (turmaVinda) {
        // 🔹 ESCONDE A SELEÇÃO COMPLETAMENTE — usuário não vê nada
        const telaSelecao = document.getElementById("tela-selecao");
        if (telaSelecao) telaSelecao.style.display = "none";

        await carregarTurmas();
        const etapa = descobrirEtapaDaTurma(turmaVinda);
        
        if (etapa) {
          const selectEtapa = document.getElementById("select-etapa");
          if (selectEtapa) selectEtapa.value = etapa;
          
          filtrarTurmasPorEtapa();

          setTimeout(() => {
            const selectTurmas = document.getElementById("select-turmas");
            if (selectTurmas) selectTurmas.value = turmaVinda;
            
            turmaAtualSelecionada = turmaVinda;

            const tituloTurma = document.getElementById("titulo-turma");
            if (tituloTurma) tituloTurma.innerText = `Mapeamento · ${turmaVinda}`;
            
            atualizarLinks(turmaVinda);

            const telaMapeamento = document.getElementById("tela-mapeamento");
            if (telaMapeamento) {
              telaMapeamento.classList.remove("hidden");
              telaMapeamento.style.display = "block";
            }

            carregarDadosMapeamento(turmaVinda);
          }, 100);
        }
      } else {
        // Sem turma na URL → mostra seleção normalmente
        await carregarTurmas();
        const telaMapeamento = document.getElementById("tela-mapeamento");
        if (telaMapeamento) telaMapeamento.style.display = "none";
      }
    });

    function atualizarLinks(nomeTurma) {
      const btnCarometro = document.getElementById("btn-carometro");
      if (btnCarometro) {
        btnCarometro.href = `index.html?turma=${encodeURIComponent(nomeTurma)}`;
      }
      const btnDiario = document.getElementById("btn-diario-bordo");
      if (btnDiario) {
        btnDiario.href = `diariodebordo.html?turma=${encodeURIComponent(nomeTurma)}`;
      }
    }

    function descobrirEtapaDaTurma(turma) {
      if (!turma) return "";
      const t = turma.toUpperCase();
      if (t.startsWith("1 REG")) return "1 REG";
      if (t.includes("ADM")) return "1 ADM";
      if (t.startsWith("2 REG")) return "2 REG";
      if (t.startsWith("3 REG")) return "3 REG";
      return "";
    }

    function verificarSessao() {
      const expiracao = localStorage.getItem(CHAVE_EXPIRACAO);
      const agora = Date.now();
      if (!expiracao || agora >= parseInt(expiracao)) {
        localStorage.removeItem(CHAVE_EXPIRACAO);
        window.location.href = "index.html";
        return false;
      }
      return true;
    }

    async function carregarTurmas() {
      const { data, error } = await supabaseClient.from("carometro").select("class_name");
      if (error) {
        console.error("Erro ao carregar turmas:", error);
        return;
      }
      todasAsTurmas = [...new Set(
        data.map(item => item.class_name?.trim()).filter(Boolean)
      )].sort((a, b) => a.localeCompare(b, "pt-BR", { numeric: true }));
    }

    function filtrarTurmasPorEtapa() {
      const selectEtapa = document.getElementById("select-etapa");
      if (!selectEtapa) return;
      
      const etapa = selectEtapa.value;
      const selectTurmas = document.getElementById("select-turmas");
      if (!selectTurmas) return;

      selectTurmas.innerHTML = '<option value="">-- Escolha uma Turma --</option>';
      if (!etapa) {
        selectTurmas.disabled = true;
        return;
      }

      let filtradas = [];
      if (etapa === "1 REG") filtradas = todasAsTurmas.filter(t => t.toUpperCase().startsWith("1 REG"));
      else if (etapa === "1 ADM") filtradas = todasAsTurmas.filter(t => t.toUpperCase().includes("ADM"));
      else if (etapa === "2 REG") filtradas = todasAsTurmas.filter(t => t.toUpperCase().startsWith("2 REG"));
      else if (etapa === "3 REG") filtradas = todasAsTurmas.filter(t => t.toUpperCase().startsWith("3 REG"));

      filtradas.forEach(t => {
        const opt = document.createElement("option");
        opt.value = t;
        opt.textContent = t;
        selectTurmas.appendChild(opt);
      });
      selectTurmas.disabled = filtradas.length === 0;
    }

    function selecionarTurmaManual(turma) {
      if (!turma) return;
      turmaAtualSelecionada = turma;
      
      const tituloTurma = document.getElementById("titulo-turma");
      if (tituloTurma) tituloTurma.innerText = `Mapeamento · ${turma}`;
      
      atualizarLinks(turma);

      const telaSelecao = document.getElementById("tela-selecao");
      if (telaSelecao) telaSelecao.style.display = "none";
      
      const telaMapeamento = document.getElementById("tela-mapeamento");
      if (telaMapeamento) {
        telaMapeamento.classList.remove("hidden");
        telaMapeamento.style.display = "block";
      }

      carregarDadosMapeamento(turma);
    }

    function voltarParaSelecao() {
      turmaAtualSelecionada = "";
      
      const telaMapeamento = document.getElementById("tela-mapeamento");
      if (telaMapeamento) telaMapeamento.style.display = "none";
      
      const telaSelecao = document.getElementById("tela-selecao");
      if (telaSelecao) telaSelecao.style.display = "block";
      
      const selectEtapa = document.getElementById("select-etapa");
      if (selectEtapa) selectEtapa.value = "";
      
      const selectTurmas = document.getElementById("select-turmas");
      if (selectTurmas) {
        selectTurmas.innerHTML = '<option value="">-- Escolha uma Turma --</option>';
        selectTurmas.disabled = true;
      }
      
      const tituloTurma = document.getElementById("titulo-turma");
      if (tituloTurma) tituloTurma.innerText = "Mapeamento de Sala";
    }

    // ✅ FUNÇÃO CORRIGIDA — estava faltando e causando o erro
    async function carregarDadosMapeamento(turma) {
      const titulo = document.getElementById("nome-turma-titulo");
      if (titulo) titulo.innerText = turma;

      const grade = document.getElementById("grade-assentos");
      if (!grade) return;
      
      grade.innerHTML = "";

      // Busca alunos da turma no Supabase
      const { data, error } = await supabaseClient
        .from("carometro")
        .select("name, seat_number, occupied")
        .eq("class_name", turma)
        .order("seat_number", { ascending: true });

      if (error) {
        console.error("Erro ao carregar dados:", error);
        grade.innerHTML = "<p class='text-red-500'>Erro ao carregar dados da turma.</p>";
        return;
      }

      // Organiza em filas de 5 assentos
      const assentosPorFila = 5;
      for (let i = 0; i < 30; i += assentosPorFila) {
        const filaDiv = document.createElement("div");
        filaDiv.className = "fila";

        for (let j = i + 1; j <= i + assentosPorFila; j++) {
          const aluno = data?.find(a => a.seat_number === j);
          const assentoDiv = document.createElement("div");
          
          assentoDiv.className = "assento";
          if (aluno && aluno.occupied) {
            assentoDiv.classList.add("ocupado");
          } else {
            assentoDiv.classList.add("livre");
          }

          assentoDiv.innerHTML = `
            <span class="numero-assento">${j}</span>
            <span class="nome-aluno">${aluno?.name || "Livre"}</span>
          `;
          
          filaDiv.appendChild(assentoDiv);
        }

        grade.appendChild(filaDiv);
      }
    }
  </script>
</body>
</html>
