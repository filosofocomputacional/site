    <style>
        * {
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        /* Scrollbar discreta */
        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* Animação suave dos cards */
        .aluno-card {
            animation: cardEntrada 0.25s ease-out;
        }
        @keyframes cardEntrada {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* Spinner de carregamento */
        .loading-spinner {
            animation: girar 0.8s linear infinite;
        }
        @keyframes girar {
            to {
                transform: rotate(360deg);
            }
        }
        button, select, input {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>

    <!-- =====================================================
         JAVASCRIPT — SELEÇÃO IDÊNTICA AO CÓDIGO ANTIGO
    ====================================================== -->
    <script>
        // CREDENCIAIS DO SUPABASE
        const SUPABASE_URL = "https://vydnefdeqljazqaisslq.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ5ZG5lZmRlcWxqYXpxYWlzc2xxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4MTkwNDEsImV4cCI6MjA5ODM5NTA0MX0.tnt7XMk3lpHU00lWQH-0wg-9fCjKEc4MiMVgZZWlY2U";
    
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let todasAsTurmas = [];
        let alunoSelecionadoParaUpload = null;
        let turmaAtualSelecionada = "";
        const CHAVE_EXPIRACAO = "carometro_sessao_expiracao";
        
        document.addEventListener("DOMContentLoaded", async () => {
            verificarSessao();
            configurarInputsDeArquivo();
        });
        
        /* ================= LOADING OVERLAY ================= */
        function mostrarLoading(mensagem) {
            document.getElementById("loading-text").innerText = mensagem || "Processando...";
            const overlay = document.getElementById("loading-overlay");
            overlay.classList.remove("hidden");
            overlay.classList.add("flex");
        }
        function esconderLoading() {
            const overlay = document.getElementById("loading-overlay");
            overlay.classList.add("hidden");
            overlay.classList.remove("flex");
        }
        
        /* ================= SESSÃO E LOGIN ================= */
        function verificarSessao() {
            const expiracao = localStorage.getItem(CHAVE_EXPIRACAO);
            const agora = Date.now();
            if (expiracao && agora < parseInt(expiracao)) {
                document.getElementById("tela-login").classList.add("hidden");
                document.getElementById("tela-selecao").classList.remove("hidden");
                document.getElementById("tela-carometro").classList.add("hidden");
                carregarTurmas();
            } else {
                localStorage.removeItem(CHAVE_EXPIRACAO);
                document.getElementById("tela-login").classList.remove("hidden");
                document.getElementById("tela-selecao").classList.add("hidden");
                document.getElementById("tela-carometro").classList.add("hidden");
            }
        }
        function efetuarLogin(event) {
            event.preventDefault();
            const senhaDigitada = document.getElementById("login-password").value;
            if (senhaDigitada === "8583") {
                const tempoExpiracao = Date.now() + (24 * 60 * 60 * 1000);
                localStorage.setItem(CHAVE_EXPIRACAO, tempoExpiracao.toString());
                document.getElementById("login-password").value = "";
                verificarSessao();
            } else {
                alert("Senha inválida! Tente novamente.");
                document.getElementById("login-password").focus();
            }
        }
        function efetuarLogout() {
            if (confirm("Tem certeza que deseja sair do sistema?")) {
                localStorage.removeItem(CHAVE_EXPIRACAO);
                verificarSessao();
            }
        }
        
        /* ================= CARREGAR TURMAS — IGUAL AO ANTIGO ================= */
        async function carregarTurmas() {
            const { data, error } = await supabaseClient
                .from("carometro")
                .select("class_name");
            if (error) {
                alert("Erro ao carregar turmas do servidor: " + error.message);
                return;
            }
            todasAsTurmas = [
                ...new Set(
                    data
                        .map(item => item.class_name)
                        .filter(Boolean)
                        .map(turma => turma.trim())
                )
            ].sort((a, b) => a.localeCompare(b, "pt-BR", { numeric: true }));
            
            const selectTurmas = document.getElementById("select-turmas");
            document.getElementById("select-etapa").value = "";
            selectTurmas.innerHTML = '<option value="">Selecione uma etapa primeiro...</option>';
            selectTurmas.disabled = true;
            selectTurmas.classList.add("disabled:bg-slate-100", "disabled:text-slate-400");
        }
        
        /* ================= FILTRAR TURMAS POR ETAPA — IGUAL AO ANTIGO ================= */
        function filtrarTurmasPorEtapa() {
            const etapaSelecionada = document.getElementById("select-etapa").value;
            const selectTurmas = document.getElementById("select-turmas");
            
            if (!etapaSelecionada) {
                selectTurmas.innerHTML = '<option value="">Selecione uma etapa primeiro...</option>';
                selectTurmas.disabled = true;
                selectTurmas.classList.add("disabled:bg-slate-100", "disabled:text-slate-400");
                return;
            }
            
            let turmasFiltradas = [];
            if (etapaSelecionada === "1 REG") {
                turmasFiltradas = todasAsTurmas.filter(turma =>
                    turma.toUpperCase().startsWith("1 REG")
                );
            } else if (etapaSelecionada === "1 ADM") {
                turmasFiltradas = todasAsTurmas.filter(turma =>
                    turma.toUpperCase().includes("ADM")
                );
            } else if (etapaSelecionada === "2 REG") {
                turmasFiltradas = todasAsTurmas.filter(turma =>
                    turma.toUpperCase().startsWith("2 REG")
                );
            } else if (etapaSelecionada === "3 REG") {
                turmasFiltradas = todasAsTurmas.filter(turma =>
                    turma.toUpperCase().startsWith("3 REG")
                );
            }
            
            selectTurmas.innerHTML = '<option value="">-- Escolha uma Turma --</option>';
            turmasFiltradas.forEach(turma => {
                const option = document.createElement("option");
                option.value = turma;
                option.textContent = turma;
                selectTurmas.appendChild(option);
            });
            
            if (!turmasFiltradas.length) {
                selectTurmas.innerHTML = '<option value="">Nenhuma turma encontrada nesta etapa</option>';
            }
            
            selectTurmas.disabled = false;
            selectTurmas.classList.remove("disabled:bg-slate-100", "disabled:text-slate-400");
        }
        
        /* ================= ENTRAR NA TURMA ================= */
        function entrarNaTurma() {
            const nomeTurma = document.getElementById("select-turmas").value;
            if (!nomeTurma) {
                alert("Selecione uma turma para prosseguir!");
                return;
            }
            turmaAtualSelecionada = nomeTurma;
            document.getElementById("titulo-turma").innerText = `Carômetro · ${nomeTurma}`;
            // Atualiza link do Diário de Bordo
            const btnDiario = document.getElementById("btn-diario-bordo");
            if (btnDiario) {
                btnDiario.href = `diariodebordo.html?turma=${encodeURIComponent(nomeTurma)}`;
            }
            document.getElementById("tela-selecao").classList.add("hidden");
            document.getElementById("tela-carometro").classList.remove("hidden");
            carregarAlunos(nomeTurma);
        }
        
        function voltarParaSelecao() {
            document.getElementById("tela-carometro").classList.add("hidden");
            document.getElementById("tela-selecao").classList.remove("hidden");
            carregarTurmas();
        }
        
        /* ================= DESCOBRIR ETAPA DA TURMA — IGUAL AO ANTIGO ================= */
        function descobrirEtapaDaTurma(turma) {
            if (!turma) return "";
            const turmaUpper = turma.toUpperCase();
            if (turmaUpper.startsWith("1 REG")) return "1 REG";
            if (turmaUpper.includes("ADM")) return "1 ADM";
            if (turmaUpper.startsWith("2 REG")) return "2 REG";
            if (turmaUpper.startsWith("3 REG")) return "3 REG";
            return "";
        }
        
        /* ================= CARREGAR ALUNOS ================= */
        async function carregarAlunos(nomeTurma) {
            mostrarLoading("Carregando alunos da turma...");
            try {
                const { data: alunos, error } = await supabaseClient
                    .from('carometro')
                    .select('*')
                    .eq('class_name', nomeTurma)
                    .order('student_name');
                if (error) throw error;
                
                const total = alunos.length;
                const comFoto = alunos.filter(a => a.photo_url).length;
                const semFoto = total - comFoto;
                
                document.getElementById("meta-total").innerText = total;
                document.getElementById("meta-com-foto").innerText = comFoto;
                document.getElementById("meta-sem-foto").innerText = semFoto;
                
                const grid = document.getElementById("grid-alunos");
                grid.innerHTML = "";
                
                if (alunos.length === 0) {
                    grid.innerHTML = `
                        <div class="col-span-full py-12 px-4 text-center rounded-2xl border border-dashed border-slate-300 bg-white/50">
                            <i class="fa-solid fa-users-slash text-3xl text-slate-300 mb-2"></i>
                            <p class="font-semibold text-slate-600 text-sm">Nenhum aluno cadastrado nesta turma</p>
                            <p class="text-xs text-slate-400 mt-1">Clique em "Adicionar Aluno" para incluir novos alunos.</p>
                        </div>
                    `;
                    return;
                }
                
                const estiloDegrade = "background: linear-gradient(135deg, #e52421 0%, #ffd100 33%, #0072ce 66%, #00a3e0 100%);";
                alunos.forEach(aluno => {
                    const card = document.createElement("div");
                    card.className = "aluno-card bg-white p-5 rounded-2xl border border-slate-200 shadow-sm hover:border-blue-200 hover:shadow-md transition-all duration-200 flex flex-col items-center justify-between text-center min-h-[300px]";
                    const isNeuro = Boolean(aluno.neurodivergente);
                    
                    let areaFoto = "";
                    if (isNeuro) {
                        if (aluno.photo_url) {
                            areaFoto = `
                                <div class="w-24 h-24 rounded-full p-[3.5px] overflow-hidden mb-3 shadow-md" style="${estiloDegrade}">
                                    <div class="w-full h-full rounded-full overflow-hidden bg-slate-100">
                                        <img src="${aluno.photo_url}" alt="${aluno.student_name}" class="w-full h-full object-cover">
                                    </div>
                                </div>`;
                        } else {
                            areaFoto = `
                                <div class="w-24 h-24 rounded-full p-[3.5px] overflow-hidden mb-3 shadow-md" style="${estiloDegrade}">
                                    <div class="w-full h-full rounded-full bg-slate-100 flex items-center justify-center text-slate-300">
                                        <i class="fa-solid fa-user text-4xl"></i>
                                    </div>
                                </div>`;
                        }
                    } else {
                        if (aluno.photo_url) {
                            areaFoto = `
                                <div class="w-24 h-24 rounded-full border-2 border-blue-500 ring-2 ring-blue-100 overflow-hidden mb-3 bg-slate-100 shadow">
                                    <img src="${aluno.photo_url}" alt="${aluno.student_name}" class="w-full h-full object-cover">
                                </div>`;
                        } else {
                            areaFoto = `
                                <div class="w-24 h-24 rounded-full bg-slate-100 border-2 border-slate-200 flex items-center justify-center overflow-hidden mb-3 text-slate-300 shadow-inner">
                                    <i class="fa-solid fa-user text-4xl"></i>
                                </div>`;
                        }
                    }
                    
                    let botoesAcao = "";
                    if (aluno.photo_url) {
                        botoesAcao = `
                            <button onclick="window.open('${aluno.photo_url}', '_blank')" class="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-600 border border-emerald-200 hover:bg-emerald-600 hover:text-white transition flex items-center justify-center text-xs shadow-sm" title="Ver foto em tamanho real"><i class="fa-solid fa-magnifying-glass"></i></button>
                            <button onclick="removerFoto('${aluno.id}')" class="w-9 h-9 rounded-xl bg-red-50 text-red-600 border border-red-200 hover:bg-red-600 hover:text-white transition flex items-center justify-center text-xs shadow-sm" title="Remover foto"><i class="fa-solid fa-trash"></i></button>
                        `;
                    } else {
                        botoesAcao = `
                            <button onclick="dispararUpload('${aluno.id}', 'camera')" class="w-9 h-9 rounded-xl bg-purple-50 text-purple-600 border border-purple-200 hover:bg-purple-600 hover:text-white transition flex items-center justify-center text-xs shadow-sm" title="Tirar foto com a Câmera"><i class="fa-solid fa-camera"></i></button>
                            <button onclick="dispararUpload('${aluno.id}', 'galeria')" class="w-9 h-9 rounded-xl bg-blue-50 text-blue-600 border border-blue-200 hover:bg-blue-600 hover:text-white transition flex items-center justify-center text-xs shadow-sm" title="Escolher foto da Galeria"><i class="fa-solid fa-image"></i></button>
                        `;
                    }
                    
                    card.innerHTML = `
                        <div class="flex flex-col items-center w-full">
                            ${areaFoto}
                            <h4 class="font-bold text-sm text-slate-900 uppercase tracking-tight line-clamp-2 px-1 mb-1 leading-snug">${aluno.student_name}</h4>
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">${aluno.class_name}</span>
                        </div>
                        <div class="flex items-center justify-center gap-2 mt-4 pt-3 border-t border-slate-100 w-full">
                            ${botoesAcao}
                            <button onclick="abrirModalEdicao('${aluno.id}', '${escaparAtributo(aluno.student_name)}', '${escaparAtributo(aluno.class_name)}', ${isNeuro})" class="w-9 h-9 rounded-xl bg-slate-50 text-slate-600 border border-slate-200 hover:bg-slate-800 hover:text-white transition flex items-center justify-center text-xs shadow-sm" title="Editar dados do aluno"><i class="fa-solid fa-pen"></i></button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                alert("Erro ao buscar alunos: " + err.message);
            } finally {
                esconderLoading();
            }
        }
        function escaparAtributo(str) {
            return String(str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
        
        /* ================= CADASTRO DE ALUNO ================= */
        function abrirModalNovoAluno() {
            if (!turmaAtualSelecionada) return alert("Selecione uma turma primeiro!");
            document.getElementById("cad-turma").value = turmaAtualSelecionada;
            document.getElementById("cad-nome").value = "";
            document.getElementById("modal-novo-aluno").classList.remove("hidden");
            document.getElementById("cad-nome").focus();
        }
        function fecharModalNovoAluno() {
            document.getElementById("modal-novo-aluno").classList.add("hidden");
        }
        async function salvarNovoAluno() {
            const nome = document.getElementById("cad-nome").value.trim().toUpperCase();
            const turma = document.getElementById("cad-turma").value.trim();
            if (!nome) return alert("Por favor, digite o nome completo do aluno!");
            mostrarLoading("Cadastrando aluno...");
            try {
                const { error } = await supabaseClient
                    .from('carometro')
                    .insert([{ student_name: nome, class_name: turma }]);
                if (error) throw error;
                fecharModalNovoAluno();
                await carregarTurmas();
                carregarAlunos(turmaAtualSelecionada);
            } catch (err) {
                alert("Erro ao cadastrar aluno: " + err.message);
                esconderLoading();
            }
        }
        
        /* ================= UPLOAD E COMPRESSÃO DE FOTOS ================= */
        function dispararUpload(alunoId, origem) {
            alunoSelecionadoParaUpload = alunoId;
            if (origem === 'camera') document.getElementById("input-camera").click();
            if (origem === 'galeria') document.getElementById("input-galeria").click();
        }
        function configurarInputsDeArquivo() {
            const processarArquivo = async (evento) => {
                const file = evento.target.files[0];
                if (!file || !alunoSelecionadoParaUpload) return;
                mostrarLoading("Otimizando e enviando foto...");
                new Compressor(file, {
                    quality: 0.6,
                    maxWidth: 800,
                    maxHeight: 800,
                    convertSize: 1000000,
                    success: async (resultadoCompactado) => {
                        try {
                            const fileExt = resultadoCompactado.name ? resultadoCompactado.name.split('.').pop() : 'jpg';
                            const caminhoArquivo = `public/${alunoSelecionadoParaUpload}-${Date.now()}.${fileExt}`;
                            const { error: storageError } = await supabaseClient.storage
                                .from('fotos-alunos')
                                .upload(caminhoArquivo, resultadoCompactado);
                            if (storageError) throw storageError;
                            const { data: { publicUrl } } = supabaseClient.storage.from('fotos-alunos').getPublicUrl(caminhoArquivo);
                            const { error: dbError } = await supabaseClient
                                .from('carometro')
                                .update({ photo_url: publicUrl })
                                .eq('id', alunoSelecionadoParaUpload);
                            if (dbError) throw dbError;
                            evento.target.value = "";
                            carregarAlunos(turmaAtualSelecionada);
                        } catch (err) {
                            alert("Erro no upload da foto: " + err.message);
                            esconderLoading();
                        }
                    },
                    error(err) {
                        alert("Erro ao compactar a imagem: " + err.message);
                        esconderLoading();
                    },
                });
            };
            document.getElementById("input-camera").addEventListener("change", processarArquivo);
            document.getElementById("input-galeria").addEventListener("change", processarArquivo);
        }
        
        /* ================= EXCLUIR FOTO ================= */
        async function removerFoto(alunoId) {
            if (!confirm("Tem certeza que deseja remover a foto deste aluno?")) return;
            mostrarLoading("Removendo foto...");
            try {
                const { data: aluno, error: fetchError } = await supabaseClient
                    .from('carometro')
                    .select('photo_url')
                    .eq('id', alunoId)
                    .single();
                if (fetchError) throw fetchError;
                if (aluno && aluno.photo_url) {
                    const caminhoArquivo = aluno.photo_url.split('/fotos-alunos/')[1];
                    if (caminhoArquivo) {
                        await supabaseClient.storage.from('fotos-alunos').remove([caminhoArquivo]);
                    }
                }
                const { error: dbError } = await supabaseClient
                    .from('carometro')
                    .update({ photo_url: null })
                    .eq('id', alunoId);
                if (dbError) throw dbError;
                carregarAlunos(turmaAtualSelecionada);
            } catch (err) {
                alert("Erro ao remover a foto: " + err.message);
                esconderLoading();
            }
        }
        
        /* ================= MODAL DE EDIÇÃO ================= */
        async function abrirModalEdicao(id, nome, turma, neurodivergente) {
            document.getElementById("edit-aluno-id").value = id;
            document.getElementById("edit-nome").value = nome;
            const selectTurma = document.getElementById("edit-turma");
            
            // Preenche com TODAS as turmas (igual ao antigo)
            selectTurma.innerHTML = "";
            if (!todasAsTurmas.length) {
                selectTurma.innerHTML = '<option value="">Nenhuma turma cadastrada</option>';
            } else {
                todasAsTurmas.forEach(t => {
                    const option = document.createElement("option");
                    option.value = t;
                    option.textContent = t;
                    if (t === turma) option.selected = true;
                    selectTurma.appendChild(option);
                });
            }
            
            if (neurodivergente) {
                document.getElementById("edit-neuro-sim").checked = true;
            } else {
                document.getElementById("edit-neuro-nao").checked = true;
            }
            document.getElementById("modal-edicao").classList.remove("hidden");
        }
        
        function fecharModal() {
            document.getElementById("modal-edicao").classList.add("hidden");
        }
        
        async function salvarEdicaoAluno() {
            const id = document.getElementById("edit-aluno-id").value;
            const novoNome = document.getElementById("edit-nome").value.trim().toUpperCase();
            const novaTurma = document.getElementById("edit-turma").value;
            const isNeurodivergente = document.getElementById("edit-neuro-sim").checked;
            
            if (!novoNome || !novaTurma) return alert("Nome e Turma não podem ficar vazios!");
            
            mostrarLoading("Salvando alterações...");
            try {
                const { error } = await supabaseClient
                    .from('carometro')
                    .update({ 
                        student_name: novoNome, 
                        class_name: novaTurma,
                        neurodivergente: isNeurodivergente 
                    })
                    .eq('id', id);
                if (error) throw error;
                fecharModal();
                
                // Restaura a seleção atual (igual ao antigo)
                const turmaAtual = turmaAtualSelecionada;
                await carregarTurmas();
                const etapaAtual = descobrirEtapaDaTurma(turmaAtual);
                if (etapaAtual) {
                    document.getElementById("select-etapa").value = etapaAtual;
                    filtrarTurmasPorEtapa();
                    document.getElementById("select-turmas").value = turmaAtual;
                }
                carregarAlunos(turmaAtual);
            } catch (err) {
                alert("Erro ao atualizar dados: " + err.message);
                esconderLoading();
            }
        }
    </script>
</body>
